<div class="container-fluid py-4">
  <div class="row g-4">

    <!-- Left: Cards -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Leave Portal</span>
          <button class="btn btn-warning btn-sm">+ Add New</button>
        </div>

        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-4">
              <div class="leave-card p-3">
                <h6 class="fw-bold mb-2">Venkatesh</h6>
                <div class="small mb-2">
                  <div class="d-flex justify-content-between">
                    <span>Start: <strong>12-Sep-26</strong></span>
                    <span>End: <strong>13-Sep-26</strong></span>
                  </div>
                  <div class="mt-1">Type: sick</div>
                </div>
                <span class="badge-status approved">Approved</span>
              </div>
            </div>

            <div class="col-md-4">
              <div class="leave-card p-3">
                <h6 class="fw-bold mb-2">saco</h6>
                <div class="small mb-2">
                  <div class="d-flex justify-content-between">
                    <span>Start: <strong>16-Aug-26</strong></span>
                    <span>End: <strong>18-Aug-26</strong></span>
                  </div>
                  <div class="mt-1">Type: personal</div>
                </div>
                <span class="badge-status approved">Approved</span>
              </div>
            </div>

            <div class="col-md-4">
              <div class="leave-card p-3">
                <h6 class="fw-bold mb-2">Charlie</h6>
                <div class="small mb-2">
                  <div class="d-flex justify-content-between">
                    <span>Start: <strong>31-Jul-26</strong></span>
                    <span>End: <strong>01-Aug-26</strong></span>
                  </div>
                  <div class="mt-1">Type: Sports</div>
                </div>
                <span class="badge-status approved">Approved</span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Right: Form -->
    <div class="col-lg-4">
      <div class="card side-panel">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>New Leave Request</span>
          <button class="btn btn-sm btn-light">Close</button>
        </div>

        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <select class="form-select">
              <option>Select Employee</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Select Leave Type</label>
            <select class="form-select">
              <option>Select Leave Type</option>
              <option>Sick</option>
              <option>Personal</option>
              <option>Marriage</option>
              <option>Sports</option>
            </select>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">End Date</label>
              <input type="date" class="form-control">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea class="form-control" rows="3" placeholder="Enter reason for leave"></textarea>
          </div>

          <button class="btn btn-primary w-100">Submit</button>
        </div>
      </div>
    </div>

  </div>
</div>
