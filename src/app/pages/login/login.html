<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-body p-4 p-md-5">
            <h3 class="login-title text-center mb-4">Leave Tracker Login</h3>

        <form>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="emailId" [(ngModel)]="loginObj.emailId" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" [(ngModel)]="loginObj.password" class="form-control" placeholder="Enter your password">
            </div>

            <button type="submit" (click)="onLogin()" class="btn btn-primary w-100 py-2 mb-3">
                Login
            </button>
        </form>

        <div class="text-muted small">
            <p class="mb-1">For Login as Hr Admin use below credentials</p>
            <ul class="mb-2">
                <li>email: <strong>hradmin@gmail.com</strong></li>
                <li>password: <strong>112233</strong></li>
            </ul>
            <p class="mb-0">
            Once you login, create Employee and use Employee credentials to login as employee.
            </p>
        </div>
        </div>
    </div>
</div>
