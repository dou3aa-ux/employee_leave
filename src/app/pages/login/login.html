<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <h3 class="login-title text-center mb-4">Leave Tracker Login</h3>

      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label" for="emailId">Email address</label>
          <input
            id="emailId"
            type="email"
            name="emailId"
            [(ngModel)]="loginObj.emailId"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="loginObj.password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger py-2" role="alert">
            {{ errorMessage }}
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 mb-3"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Signing in…' : 'Login' }}
        </button>
      </form>

      <div class="text-muted small">
        <p class="mb-1">Demo administrator account</p>
        <ul class="mb-2">
          <li>Email: <strong>hradmin@gmail.com</strong></li>
          <li>Password: <strong>112233</strong></li>
        </ul>
        <p class="mb-0">
          The administrator can create employee accounts from the Employees page.
        </p>
      </div>
    </div>
  </div>
</div>
