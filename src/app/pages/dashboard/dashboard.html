<div class="dashboard">

  <h3 class="page-title mb-4">Dashboard</h3>

  <!-- Stats Cards -->
  <div class="row g-4 mb-4">
    <div class="col-md-3">
      <div class="stat-card border-primary">
        <div class="stat-label">TOTAL EMPLOYEES</div>
        <div class="stat-value">156</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card border-success">
        <div class="stat-label">ACTIVE LEAVES</div>
        <div class="stat-value">23</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card border-info">
        <div class="stat-label">PENDING APPROVALS</div>
        <div class="stat-value">8</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card border-warning">
        <div class="stat-label">THIS MONTH</div>
        <div class="stat-value">45</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- Recent Leave Applications -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header bg-white">
          <h5 class="mb-0 text-primary">Recent Leave Applications</h5>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>EMPLOYEE</th>
                  <th>LEAVE TYPE</th>
                  <th>DURATION</th>
                  <th>STATUS</th>
                  <th>ACTION</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>John Doe</td>
                  <td>Sick Leave</td>
                  <td>2 days</td>
                  <td><span class="badge bg-warning text-dark">Pending</span></td>
                  <td>
                    <button class="btn btn-success btn-sm me-1">Approve</button>
                    <button class="btn btn-danger btn-sm">Reject</button>
                  </td>
                </tr>
                <tr>
                  <td>Jane Smith</td>
                  <td>Annual Leave</td>
                  <td>5 days</td>
                  <td><span class="badge bg-success">Approved</span></td>
                  <td>
                    <button class="btn btn-info btn-sm">View</button>
                  </td>
                </tr>
                <tr>
                  <td>Mike Johnson</td>
                  <td>Personal Leave</td>
                  <td>1 day</td>
                  <td><span class="badge bg-warning text-dark">Pending</span></td>
                  <td>
                    <button class="btn btn-success btn-sm me-1">Approve</button>
                    <button class="btn btn-danger btn-sm">Reject</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="col-lg-4">
      <div class="card">
        <div class="card-header bg-white">
          <h5 class="mb-0">Quick Actions</h5>
        </div>
        <div class="card-body d-grid gap-3">
          <button class="btn btn-primary btn-lg">Add New Employee</button>
          <button class="btn btn-success btn-lg">New Leave Request</button>
          <button class="btn btn-info btn-lg text-white">Export Reports</button>
          <button class="btn btn-warning btn-lg text-white">System Settings</button>
        </div>
      </div>
    </div>
  </div>

</div>
